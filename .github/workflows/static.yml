  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: |
      cd frontend
      yarn install

  - name: Build project
    run: |
      cd frontend
      yarn build

  - name: Setup Pages
    uses: actions/configure-pages@v5

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: 'frontend/dist'
